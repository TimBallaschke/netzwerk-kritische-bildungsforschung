<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cellular Noise</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
</head>
<body>
<script>
const vert = `
precision highp float;
attribute vec3 aPosition;
attribute vec2 aTexCoord;
varying vec2 vTexCoord;
void main() {
  vTexCoord = aTexCoord;
  vec4 pos = vec4(aPosition, 1.0);
  pos.xy = pos.xy * 2.0 - 1.0;
  gl_Position = pos;
}
`;

const frag = `
precision highp float;
varying vec2 vTexCoord;
uniform float uTime;
uniform vec2 uResolution;

// pseudo-random 2D point per cell
vec2 hash2(vec2 p) {
  p = vec2(dot(p, vec2(127.1, 311.7)),
           dot(p, vec2(269.5, 183.3)));
  return fract(sin(p) * 43758.5453);
}

void main() {
  vec2 uv = vTexCoord;
  uv.x *= uResolution.x / uResolution.y; // keep cells square
  uv *= 7.0;                              // cell density

  vec2 iuv = floor(uv);
  vec2 fuv = fract(uv);

  float f1 = 1.0; // nearest seed distance
  float f2 = 1.0; // second-nearest

  for (int y = -1; y <= 1; y++) {
    for (int x = -1; x <= 1; x++) {
      vec2 n = vec2(float(x), float(y));
      vec2 p = hash2(iuv + n);
      // animate the seed point inside its cell
      p = 0.5 + 0.5 * sin(uTime * 0.6 + 6.2831 * p);
      float d = length(n + p - fuv);
      if (d < f1)      { f2 = f1; f1 = d; }
      else if (d < f2) { f2 = d; }
    }
  }

  float edge  = f2 - f1;                          // small near cell walls
  float lines = 1.0 - smoothstep(0.0, 0.08, edge);

  vec3 col = vec3(0.02, 0.04, 0.07);                                 // background
  col += vec3(0.3, 0.7, 1.0) * lines * 1.3;                          // glowing membranes
  col += vec3(0.05, 0.15, 0.25) * (1.0 - smoothstep(0.0, 0.45, f1)); // soft cell interior

  gl_FragColor = vec4(col, 1.0);
}
`;

let cellShader;

function setup() {
  createCanvas(windowWidth, windowHeight, WEBGL);
  noStroke();
  cellShader = createShader(vert, frag);
}

function draw() {
  shader(cellShader);
  cellShader.setUniform('uTime', millis() * 0.001);
  cellShader.setUniform('uResolution', [width, height]);
  rect(0, 0, width, height);
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
</script>
</body>
</html>
