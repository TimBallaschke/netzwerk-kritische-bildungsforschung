title: Seminarpläne

# Standalone nav section — NOT part of the Aktuelles feed. A curated list
# of shared seminar syllabi, each with a (non-downloadable) PDF.

options:
  template: seminarplaene
  changeTemplate: false
  delete: false

fields:
  # ── Einleitung ──
  introHeadline:
    type: headline
    label: Einleitung
  intro:
    label: Text
    extends: fields/italictext
    size: medium
  # ── Kontakt ──
  lineKontakt:
    type: line
  kontaktHeadline:
    type: headline
    label: Kontakt für Einreichungen
  kontaktEmail:
    label: E-Mail-Adresse
    type: email
  # ── Seminarpläne ──
  linePlaene:
    type: line
  plaeneHeadline:
    type: headline
    label: Seminarpläne
  plaene:
    label: Einträge
    type: structure
    fields:
      dozierende:
        label: Dozierende
        type: text
        required: true
      titel:
        label: Titel des Seminars
        type: text
        required: true
      pdf:
        label: PDF (Seminarplan)
        type: files
        max: 1
        min: 1
        accept: application/pdf
        required: true
