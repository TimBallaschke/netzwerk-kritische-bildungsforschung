title: Notiz

# A free-form note: a hint to an article, radio piece, initiative, etc.
# Usually points OUT (external link) or to another page on this site, so
# the link target matters most. A detail page is optional.

options:
  template: notiz
  changeTemplate: false

tabs:
  eintrag:
    label: Eintrag
    icon: page
    columns:
      - width: 2/3
        fields:
          subinfo:
            label: Untertitel / Quelle
            type: writer
            inline: true
            marks:
              - italic
            help: z. B. „Deutschlandfunk Kultur“.
          description:
            label: Teaser / Beschreibung
            type: textarea
            size: large
      - width: 1/3
        fields:
          date:
            label: Datum
            type: date
            display: DD.MM.YYYY
          inAktuelles:
            label: In Aktuelles zeigen
            type: toggle
            default: true
            text:
              - "Nein"
              - "Ja"
          linkHeadline:
            type: headline
            label: Weiterlesen führt zu …
          linkType:
            label: Ziel
            type: select
            default: external
            empty: false
            options:
              self: Eigene Detailseite
              internal: Andere Seite auf dieser Website
              external: Externer Link
          internalPage:
            label: Verlinkte Seite
            type: pages
            max: 1
            when:
              linkType: internal
          externalUrl:
            label: Externe URL
            type: url
            when:
              linkType: external

  detail:
    label: Detailseite
    icon: text
    fields:
      detailHint:
        type: info
        theme: passive
        text: Nur ausfüllen, wenn die Notiz eine eigene Detailseite haben soll (Ziel = „Eigene Detailseite“).
      body:
        label: Fließtext
        type: textarea
        size: huge
