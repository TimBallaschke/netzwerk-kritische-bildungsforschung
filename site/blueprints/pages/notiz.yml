title: Notiz

# A free-form note: a hint to an article, radio piece, initiative, etc.
# Usually points OUT (external link) or to another page on this site, so
# the link target matters most. A detail page is optional.

options:
  template: notiz
  changeTemplate: false

create:
  slug: "{{ page.title }}"

status:
  draft: true
  listed: true

columns:
  - width: 2/3
    fields:
      subinfo:
        label: Untertitel / Quelle
        extends: fields/italictext
        size: small
      description:
        label: Teaser / Beschreibung (für Vorschau)
        extends: fields/italictext
        size: small
        maxlength: 350
        counter: true
        help: Kurztext für die Aktuelles-Ansicht. Max. 350 Zeichen.
      inAktuelles:
        label: In Aktuelles zeigen
        type: toggle
        default: true
        width: 1/2
        text:
          - "Nein"
          - "Ja"
      linkType:
        label: Verlinkung?
        type: select
        default: external
        empty: false
        required: true
        help: >
          Legt fest, wohin der Eintrag im Aktuelles-Feed verlinkt.
          „Eigene Detailseite“ öffnet eine Unterseite mit Fließtext, Bild(ern), Link und PDF.
          „Externer Link“ führt direkt auf eine andere Website (Feld „Externe URL“).
          „Keine Verlinkung“ zeigt den Eintrag nur als Teaser im Feed, ohne
          weiterführenden Link.
        options:
          self: Eigene Detailseite
          external: Externer Link
          none: Keine Verlinkung
        width: 1/2
      externalUrlTitle:
        label: Linktitel
        type: text
        help: Wird als sichtbarer Linktext statt der URL angezeigt, z. B. „Weitere Informationen“.
        when:
          linkType: external
      externalUrl:
        label: Externe URL
        type: url
        when:
          linkType: external
      body:
        label: Fließtext
        extends: fields/italictext
        size: huge
        when:
          linkType: self
      image:
        label: Bild(er)
        type: files
        layout: cards
        query: page.images
        when:
          linkType: self
      linkTitle:
        label: Linktitel
        type: text
        help: Wird als sichtbarer Linktext statt der URL angezeigt, z. B. „Weitere Informationen“.
        when:
          linkType: self
      linkUrl:
        label: Weiterführender Link
        type: url
        when:
          linkType: self
      downloadPdf:
        label: PDF zum Download
        type: files
        max: 1
        accept: application/pdf
        when:
          linkType: self
  - width: 1/3
    fields:
      date:
        label: Datum
        type: date
        display: DD.MM.YYYY
      authors:
        label: Autor*in / Organisation
        type: text
