title: Veranstaltung

# An event. Lives flat in the /aktuelles pool. Past events (date in the
# past) are also surfaced under Über Uns → Vergangene Veranstaltungen.

options:
  template: veranstaltung
  changeTemplate: false

tabs:
  eintrag:
    label: Eintrag
    icon: page
    columns:
      - width: 2/3
        fields:
          subinfo:
            label: Untertitel
            type: writer
            inline: true
            marks:
              - italic
            help: Art der Veranstaltung + Organisation, z. B. „Tagung mit <em>Hannelore Wolb</em> (Miteinander e.V.)“.
          description:
            label: Teaser / Beschreibung
            type: textarea
            size: large
      - width: 1/3
        fields:
          date:
            label: Datum
            type: date
            display: DD.MM.YYYY
          ort:
            label: Ort
            type: text
          onlineHinweis:
            label: Hinweis Online-Teilnahme
            type: text
            help: z. B. Zoom-Link oder Kontaktadresse. Leer lassen, wenn nicht zutreffend.
          inAktuelles:
            label: In Aktuelles zeigen
            type: toggle
            default: true
            text:
              - "Nein"
              - "Ja"
          linkHeadline:
            type: headline
            label: Weiterlesen führt zu …
          linkType:
            label: Ziel
            type: select
            default: self
            empty: false
            options:
              self: Eigene Detailseite
              internal: Andere Seite auf dieser Website
              external: Externer Link
          internalPage:
            label: Verlinkte Seite
            type: pages
            max: 1
            when:
              linkType: internal
          externalUrl:
            label: Externe URL
            type: url
            when:
              linkType: external

  detail:
    label: Detailseite
    icon: text
    fields:
      body:
        label: Fließtext (Thema)
        type: textarea
        size: huge
      image:
        label: Bild(er) / Flyer
        type: files
        layout: cards
        query: page.images
      downloadPdf:
        label: PDF zum Download
        type: files
        max: 1
        accept: application/pdf
