title: Call for Papers

# A call for papers. Lives flat in the /aktuelles pool.

options:
  template: call-for-papers
  changeTemplate: false

tabs:
  eintrag:
    label: Eintrag
    icon: page
    columns:
      - width: 2/3
        fields:
          subinfo:
            label: Untertitel
            type: writer
            inline: true
            marks:
              - italic
            help: z. B. „Deadline 14.7.2026“ oder Autor:in/Organisation.
          description:
            label: Teaser / Beschreibung
            type: textarea
            size: large
      - width: 1/3
        fields:
          deadline:
            label: Deadline Call
            type: date
            display: DD.MM.YYYY
          date:
            label: Datum (Tagung)
            type: date
            display: DD.MM.YYYY
          ort:
            label: Ort
            type: text
          inAktuelles:
            label: In Aktuelles zeigen
            type: toggle
            default: true
            text:
              - "Nein"
              - "Ja"
          linkHeadline:
            type: headline
            label: Weiterlesen führt zu …
          linkType:
            label: Ziel
            type: select
            default: self
            empty: false
            options:
              self: Eigene Detailseite
              internal: Andere Seite auf dieser Website
              external: Externer Link
          internalPage:
            label: Verlinkte Seite
            type: pages
            max: 1
            when:
              linkType: internal
          externalUrl:
            label: Externe URL
            type: url
            when:
              linkType: external

  detail:
    label: Detailseite
    icon: text
    fields:
      body:
        label: Fließtext (Thema)
        type: textarea
        size: huge
      downloadPdf:
        label: Ausführlicher Call (PDF)
        type: files
        max: 1
        accept: application/pdf
        help: Der ausführliche Call zum Download.
