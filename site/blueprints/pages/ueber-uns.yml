title: Über Uns

# Static section. The "Vergangene Veranstaltungen" block at the bottom is
# rendered in the template by pulling type=veranstaltung entries with a
# past date from /aktuelles — no content is duplicated here.

options:
  template: ueber-uns
  changeTemplate: false
  delete: false

status:
  draft: true
  listed: true

fields:
  # ── Wer sind wir? (Einstieg) ──
  wasWollenWirHeadline:
    type: headline
    label: Was wollen wir?
  wasWollenWir:
    label: Text
    extends: fields/italictext
    size: medium

  lineMachen:
    type: line
  wasMachenWirHeadline:
    type: headline
    label: Was machen wir?
  wasMachenWir:
    label: Text
    extends: fields/italictext
    size: medium

  lineSind:
    type: line
  werSindWirHeadline:
    type: headline
    label: Wer sind wir?
  werSindWir:
    label: Text
    extends: fields/italictext
    size: medium
  kontakte:
    label: Ansprechpersonen (Netzwerk)
    type: structure
    fields:
      name:
        label: Name
        type: text
        width: 1/2
      email:
        label: E-Mail
        type: email
        width: 1/2
  akLinkTitle:
    label: Linktitel
    type: text
    help: Wird als sichtbarer Linktext statt der URL angezeigt, z. B. „Weitere Informationen“.
  akLink:
    label: Link zur Homepage AK / IfS
    type: url
  rmuLogo:
    label: RMU-Logo
    type: files
    max: 1
    multiple: false
    search: false
    query: page.images

  # ── Vertiefung ──
  lineNetzwerk:
    type: line
  vertiefungsBloecke:
    label: Weitere Abschnitte
    type: structure
    empty: Noch keine weiteren Abschnitte angelegt
    help: Abschnitte unterhalb des Logos. Die Zwischenüberschrift und der Fließtext sind Pflichtfelder; Ansprechperson und E-Mail/Link sind optional.
    columns:
      zwischenueberschrift:
        label: Zwischenüberschrift
        width: 2/5
      fliesstext:
        label: Fließtext
        width: 2/5
      ansprechpersonName:
        label: Ansprechperson
        width: 1/5
    fields:
      zwischenueberschrift:
        label: Zwischenüberschrift
        type: text
        required: true
      fliesstext:
        label: Fließtext
        extends: fields/italictext
        size: medium
        required: true
      ansprechpersonName:
        label: Name
        type: text
        width: 1/2
      ansprechpersonEmail:
        label: E-Mail
        type: email
        width: 1/2
      kontaktLinkTitle:
        label: Linktitel
        type: text
        help: Wird als sichtbarer Linktext statt der URL angezeigt, z. B. „Weitere Informationen“.
      kontaktLink:
        label: E-Mail / Link
        type: text
        help: "Optional: zusätzliche E-Mail-Adresse oder URL"

  # ── Vergangene Veranstaltungen ──
  lineVergangene:
    type: line
  vergangeneHeadline:
    type: headline
    label: Vergangene Veranstaltungen des Netzwerkes
  vergangeneHint:
    type: info
    text: |
      Vergangene Veranstaltungen werden automatisch aus den
      Aktuelles-Einträgen vom Typ „Veranstaltung“ mit einem
      Datum in der Vergangenheit gezogen. Pflege erfolgt dort.
