title: Über Uns

# Static section. The "Vergangene Veranstaltungen" block at the bottom is
# rendered in the template by pulling type=veranstaltung entries with a
# past date from /aktuelles — no content is duplicated here.

options:
  template: ueber-uns
  changeTemplate: false
  delete: false

fields:
  # ── Wer sind wir? (Einstieg) ──
  wasWollenWirHeadline:
    type: headline
    label: Was wollen wir?
  wasWollenWir:
    label: Text
    extends: fields/italictext
    size: medium

  lineMachen:
    type: line
  wasMachenWirHeadline:
    type: headline
    label: Was machen wir?
  wasMachenWir:
    label: Text
    extends: fields/italictext
    size: medium

  lineSind:
    type: line
  werSindWirHeadline:
    type: headline
    label: Wer sind wir?
  werSindWir:
    label: Text
    extends: fields/italictext
    size: medium
  kontakte:
    label: Ansprechpersonen (Netzwerk)
    type: structure
    fields:
      name:
        label: Name
        type: text
        width: 1/2
      email:
        label: E-Mail
        type: email
        width: 1/2
  akLink:
    label: Link zur Homepage AK / IfS
    type: url
  rmuLogo:
    label: RMU-Logo
    type: files
    max: 1
    multiple: false
    search: false
    query: page.images

  # ── Vertiefung ──
  lineNetzwerk:
    type: line
  wasIstDasNetzwerkHeadline:
    type: headline
    label: Was ist das Netzwerk, wie versteht es sich?
  wasIstDasNetzwerk:
    label: Text
    extends: fields/italictext
    size: medium

  lineMitmachen:
    type: line
  werKannMitmachenHeadline:
    type: headline
    label: Wer kann wie mitmachen?
  werKannMitmachen:
    label: Text
    extends: fields/italictext
    size: medium
  mitmachenKontakte:
    label: Ansprechpersonen zum Mitmachen
    type: structure
    fields:
      name:
        label: Name
        type: text
        width: 1/2
      email:
        label: E-Mail
        type: email
        width: 1/2

  lineVorstellung:
    type: line
  vorstellungAkHeadline:
    type: headline
    label: Vorstellung Arbeitskreis (AK) am Institut für Sozialforschung (IfS)
  vorstellungAk:
    label: Text
    extends: fields/italictext
    size: medium

  # ── Vergangene Veranstaltungen ──
  lineVergangene:
    type: line
  vergangeneHeadline:
    type: headline
    label: Vergangene Veranstaltungen des Netzwerkes
  vergangeneHint:
    type: info
    text: |
      Vergangene Veranstaltungen werden automatisch aus den
      Aktuelles-Einträgen vom Typ „Veranstaltung“ mit einem
      Datum in der Vergangenheit gezogen. Pflege erfolgt dort.
