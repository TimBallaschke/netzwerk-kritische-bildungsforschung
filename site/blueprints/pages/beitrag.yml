title: Beitrag

# One blog post. Lives flat in the /aktuelles pool (type encoded by this
# template). Detail view rendered at /beiträge/<slug>; listed by the
# nested Beiträge page and, when toggled, in the Aktuelles feed.

options:
  template: beitrag
  changeTemplate: false

tabs:
  eintrag:
    label: Eintrag
    icon: page
    columns:
      - width: 2/3
        fields:
          authors:
            label: Autor:innen
            type: text
            help: z. B. „von Jonas Reichert“ oder „Clara Hoffmann und Tobias Wendt“.
          subinfo:
            label: Untertitel
            type: writer
            inline: true
            marks:
              - italic
            help: Optionale Zeile unter dem Titel. Namen können kursiv ausgezeichnet werden.
          description:
            label: Teaser / Beschreibung
            type: textarea
            size: large
            help: Kurztext für die Listen-/Feed-Ansicht.
      - width: 1/3
        fields:
          date:
            label: Datum
            type: date
            display: DD.MM.YYYY
          inAktuelles:
            label: In Aktuelles zeigen
            type: toggle
            default: true
            text:
              - "Nein"
              - "Ja"
          linkHeadline:
            type: headline
            label: Weiterlesen führt zu …
          linkType:
            label: Ziel
            type: select
            default: self
            empty: false
            options:
              self: Eigene Detailseite
              internal: Andere Seite auf dieser Website
              external: Externer Link
          internalPage:
            label: Verlinkte Seite
            type: pages
            max: 1
            when:
              linkType: internal
          externalUrl:
            label: Externe URL
            type: url
            when:
              linkType: external

  detail:
    label: Detailseite
    icon: text
    fields:
      authorPhoto:
        label: Foto Autor:in
        type: files
        max: 1
        query: page.images
      body:
        label: Fließtext
        type: textarea
        size: huge
        help: Volltext der Detailseite. Zwischenüberschriften mit „## Überschrift“, Links als [Text](URL).
      downloadPdf:
        label: PDF zum Download
        type: files
        max: 1
        accept: application/pdf
        help: Optionaler PDF-Download am Ende der Detailseite.
