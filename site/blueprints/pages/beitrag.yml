title: Beitrag

# One blog post. Lives flat in the /aktuelles pool (type encoded by this
# template). Detail view rendered at /beiträge/<slug>; listed by the
# nested Beiträge page and, when toggled, in the Aktuelles feed.

options:
  template: beitrag
  changeTemplate: false

columns:
  - width: 2/3
    fields:
      authors:
        label: Autor:innen
        type: text
      authorPhoto:
        label: Foto Autor:in
        type: files
        max: 1
        query: page.images
      description:
        label: Teaser / Beschreibung (für Vorschau)
        extends: fields/italictext
        size: large
        maxlength: 350
        counter: true
        help: Kurztext für die Aktuelles-Ansicht. Max. 350 Zeichen.
      inAktuelles:
        label: In Aktuelles zeigen
        type: toggle
        default: true
        width: 1/2
        text:
          - "Nein"
          - "Ja"
      body:
        label: Fließtext
        type: textarea
        size: huge
        buttons:
          - subheadline
          - italic
          - link
      downloadPdf:
        label: PDF zum Download
        type: files
        max: 1
        accept: application/pdf
  - width: 1/3
    fields:
      dateManual:
        label: Datum
        type: toggle
        default: false
        text:
          - "Automatisch (Erstellungsdatum)"
          - "Manuell setzen"
      date:
        label: Datum
        type: date
        display: DD.MM.YYYY
        default: now
        when:
          dateManual: true
