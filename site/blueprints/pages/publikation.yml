title: Publikation

# A publication. Lives flat in the /aktuelles pool.

options:
  template: publikation
  changeTemplate: false

columns:
  - width: 1/1
    fields:
      authors:
        label: Autor:innen
        type: text
      description:
        label: Teaser / Beschreibung
        extends: fields/italictext
        size: small
      inAktuelles:
        label: In Aktuelles zeigen
        type: toggle
        default: true
        width: 1/2
        text:
          - "Nein"
          - "Ja"
      linkType:
        label: Verlinkung?
        type: select
        default: self
        empty: false
        required: true
        help: >
          Legt fest, wohin der Eintrag im Aktuelles-Feed verlinkt.
          „Eigene Detailseite“ öffnet eine Unterseite mit Cover, Fließtext und Link.
          „Externer Link“ führt direkt auf eine andere Website (Feld „Externe URL“).
          „Keine Verlinkung“ zeigt den Eintrag nur als Teaser im Feed, ohne
          weiterführenden Link.
        options:
          self: Eigene Detailseite
          external: Externer Link
          none: Keine Verlinkung
        width: 1/2
      externalUrl:
        label: Externe URL
        type: url
        when:
          linkType: external
      cover:
        label: Cover / Bild
        type: files
        max: 1
        query: page.images
        when:
          linkType: self
      body:
        label: Fließtext (Klappentext)
        extends: fields/italictext
        size: huge
        when:
          linkType: self
      linkUrl:
        label: Weiterführender Link
        type: url
        when:
          linkType: self
