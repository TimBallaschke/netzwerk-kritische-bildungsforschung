title: Publikation

# A publication. Lives flat in the /aktuelles pool.

options:
  template: publikation
  changeTemplate: false

tabs:
  eintrag:
    label: Eintrag
    icon: page
    columns:
      - width: 2/3
        fields:
          authors:
            label: Autor:innen
            type: text
            help: z. B. „von Theo Marwitz“.
          subinfo:
            label: Untertitel
            type: writer
            inline: true
            marks:
              - italic
            help: Optionale Zeile unter dem Titel.
          description:
            label: Teaser / Beschreibung
            type: textarea
            size: large
            help: Klappentext-Kurzfassung für die Listen-/Feed-Ansicht.
      - width: 1/3
        fields:
          date:
            label: Datum
            type: date
            display: DD.MM.YYYY
          inAktuelles:
            label: In Aktuelles zeigen
            type: toggle
            default: true
            text:
              - "Nein"
              - "Ja"
          linkHeadline:
            type: headline
            label: Weiterlesen führt zu …
          linkType:
            label: Ziel
            type: select
            default: self
            empty: false
            options:
              self: Eigene Detailseite
              internal: Andere Seite auf dieser Website
              external: Externer Link
          internalPage:
            label: Verlinkte Seite
            type: pages
            max: 1
            when:
              linkType: internal
          externalUrl:
            label: Externe URL
            type: url
            when:
              linkType: external

  detail:
    label: Detailseite
    icon: text
    fields:
      cover:
        label: Cover / Bild
        type: files
        max: 1
        query: page.images
      body:
        label: Fließtext (Klappentext)
        type: textarea
        size: huge
      downloadPdf:
        label: PDF zum Download
        type: files
        max: 1
        accept: application/pdf
