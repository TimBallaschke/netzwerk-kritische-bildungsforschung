title: Startseite

# The public startpage (serves "/"). Holds the intro text ("Grundidee")
# and the Aktuelles feed (drag-orderable). The site overview only manages
# the page list and the footer.

options:
  changeTemplate: false
  delete: false
  duplicate: false

status:
  draft: true
  listed: true

columns:
  - width: 1/1
    sections:
      start:
        type: fields
        fields:
          intro:
            label: Grundidee (Intro-Text)
            extends: fields/italictext
            size: medium
            maxlength: 500
            counter: true
      feed:
        type: aktuellesfeed
        headline: Aktuelles-Feed
        help: >
          Pro Eintrag über »In Aktuelles zeigen« aus-/einblenden, Reihenfolge per Drag & Drop.
          Die Netzwerkansicht zeigt maximal 15 Karten auf Desktop und 12 auf Mobil –
          jeweils passend zum aktiven Filter und in dieser Reihenfolge.
          Die Listenansicht zeigt alle Einträge.
