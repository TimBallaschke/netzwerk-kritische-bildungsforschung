title: Startseite

# The public startpage (serves "/"). Holds the intro text ("Grundidee")
# and the Aktuelles feed (drag-orderable). The site overview only manages
# the page list and the footer.

options:
  changeTemplate: false
  delete: false
  duplicate: false

columns:
  - width: 1/1
    sections:
      start:
        type: fields
        fields:
          intro:
            label: Grundidee (Intro-Text)
            extends: fields/italictext
            size: medium
      feed:
        type: aktuellesfeed
        headline: Aktuelles-Feed
        help: Zeigt den Aktuelles-Feed der Startseite. Pro Eintrag über »In Aktuelles zeigen« aus-/einblenden, Reihenfolge per Drag & Drop.
