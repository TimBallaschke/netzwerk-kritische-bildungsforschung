title: Inhalte (Beiträge, Veranstaltungen, etc.)

# The content pool, organised into clickable type-pages ("Rubriken"):
# Beiträge · Veranstaltungen · Call for Papers · Publikationen · Notizen.
# Click a Rubrik to manage its entries (drag-orderable within the type).
#
# The homepage Aktuelles feed aggregates entries across all Rubriken,
# ordered by DATE (newest first). The "In Aktuelles zeigen" toggle on each
# entry controls whether it appears in that feed. The Rubriken are a fixed
# set, so no adding/removing here.

options:
  template: aktuelles-container
  changeTemplate: false
  delete: false

status:
  draft: true
  listed: true

sections:
  rubriken:
    label: Rubriken
    type: pages
    templates:
      - beitraege
      - veranstaltungen
      - cfp
      - publikationen
      - notizen
    create: false
    sortable: false
