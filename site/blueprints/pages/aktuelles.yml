title: Aktuelles-Eintrag

# A single "Aktuelles" entry. Not tied to the list — these pages are
# reused wherever Aktuelles content is shown (list, Beiträge, …).

options:
  template: aktuelles

columns:
  - width: 2/3
    fields:
      type:
        label: Typ
        type: select
        required: true
        default: veranstaltung
        options:
          veranstaltung: Veranstaltung
          call-for-papers: Call for Papers
          blog: Beiträge
          notiz: Notiz
          publikation: Publikation
      date:
        label: Datum
        type: date
        display: DD.MM.YYYY
        width: 1/2
        help: Nur bei datierten Einträgen (z. B. Veranstaltung). Leer lassen, wenn kein Datum angezeigt werden soll.
      subinfo:
        label: Subinfo
        type: writer
        inline: true
        marks:
          - italic
        help: Zusatzzeile unter dem Titel. Namen können kursiv ausgezeichnet werden.
      description:
        label: Beschreibung
        type: textarea
        size: large
  - width: 1/3
    fields:
      title:
        label: Titel
        type: text
