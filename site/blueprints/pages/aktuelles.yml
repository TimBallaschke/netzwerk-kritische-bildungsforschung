title: Aktuelles
icon: news

options:
  preview: false
  delete: false

columns:
  main:
    width: 2/3
    sections:
      scraper:
        type: aktuelles-scraper
      drafts:
        headline: Entwürfe – zur Freigabe
        type: pages
        status: drafts
        template: aktuelles-item
        create: aktuelles-item
        sortBy: date desc
        info: "{{ page.itemType }} · {{ page.relevance }}/5"
        empty: Keine neuen Entwürfe. Klicke oben auf „Neue Inhalte suchen".
      published:
        headline: Veröffentlicht
        type: pages
        status: listed
        template: aktuelles-item
        sortBy: date desc
        info: "{{ page.itemType }}"
        empty: Noch keine veröffentlichten Einträge.
  sidebar:
    width: 1/3
    sections:
      config:
        type: fields
        fields:
          configHeadline:
            type: headline
            label: Suchparameter
          themen:
            label: Themen-Keywords
            type: textarea
            buttons: false
            font: monospace
          formate:
            label: Format
            type: textarea
            buttons: false
            font: monospace
          quellen:
            label: Kuratierte Quellen (Domains, nur Tavily)
            type: textarea
            buttons: false
            font: monospace
          sourcesEnabled:
            label: Aktive Quellen-Pipelines
            type: checkboxes
            columns: 1
            options:
              tavily: Tavily Web-Suche
              openalex: OpenAlex
            default:
              - tavily
              - openalex
          maxResults:
            label: Max. neue Einträge pro Lauf
            type: number
            default: 10
            min: 1
            max: 50
            help: "Lauf stoppt, sobald so viele passende Einträge gespeichert wurden."
          minRelevance:
            label: Mindest-Relevanz (1–5)
            type: number
            default: 3
            min: 1
            max: 5
            help: "Treffer mit niedrigerer Bewertung werden verworfen."
          maxAgeMonths:
            label: Max. Alter (Monate)
            type: number
            default: 2
            min: 1
            max: 24
            help: "Einträge mit erkennbarem Datum, das älter ist, werden verworfen."
