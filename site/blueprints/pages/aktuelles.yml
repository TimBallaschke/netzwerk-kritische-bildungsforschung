title: Aktuelles
icon: news

options:
  preview: false
  delete: false

columns:
  main:
    width: 2/3
    sections:
      scraper:
        type: aktuelles-scraper
      drafts:
        headline: Entwürfe – zur Freigabe
        type: pages
        status: drafts
        template: aktuelles-item
        create: aktuelles-item
        sortBy: date desc
        info: "{{ page.itemType }} · {{ page.relevance }}/5"
        empty: Keine neuen Entwürfe. Klicke oben auf „Neue Inhalte suchen".
      published:
        headline: Veröffentlicht
        type: pages
        status: listed
        template: aktuelles-item
        sortBy: date desc
        info: "{{ page.itemType }}"
        empty: Noch keine veröffentlichten Einträge.
  sidebar:
    width: 1/3
    sections:
      config:
        type: fields
        fields:
          configHeadline:
            type: headline
            label: Suchparameter
          themen:
            label: Themen-Keywords
            type: textarea
            buttons: false
            font: monospace
            help: "Eine pro Zeile. Werden mit jedem Format-Trigger kombiniert."
          formate:
            label: Format-Trigger
            type: textarea
            buttons: false
            font: monospace
            help: "Eine pro Zeile. Wird an jedes Themen-Keyword angehängt (z. B. „Call for Papers 2026")."
          quellen:
            label: Kuratierte Quellen (Domains)
            type: textarea
            buttons: false
            font: monospace
            help: "Eine Domain pro Zeile, ohne https://. Filtert die Suche zusätzlich auf diese Quellen."
          maxResults:
            label: Max. neue Einträge pro Lauf
            type: number
            default: 10
            min: 1
            max: 30
          minRelevance:
            label: Mindest-Relevanz (1–5)
            type: number
            default: 3
            min: 1
            max: 5
            help: "Treffer mit niedrigerer Bewertung werden verworfen."
