title: Netzwerk Kritische Bildungsforschung

# Top-level structure.
#
# Public navigation is fixed to three sections — Über Uns · Beiträge ·
# Seminarpläne. "Aktuelles" is an UNLISTED pool: it stores every posting
# (Beitrag, Veranstaltung, Notiz, Call for Papers, Publikation) as one
# flat, drag-sortable list. The startpage renders that list as the
# "Aktuelles" feed; the "Beiträge" nav link is NOT a separate page — it's
# a view of the same pool filtered to type = blog (rendered via route in
# the template layer). Content lives in one place; the rest are views.
#
# The site overview itself only manages the page list (Seiten) and the
# footer. The startpage's own content (intro + Aktuelles feed) lives on
# the "Startseite" page (template `home`, serves "/"), reachable from the
# Seiten list below.

columns:
  - width: 1/1
    sections:
      seiten:
        type: fields
        fields:
          seitenHeadline:
            type: headline
            label: Seiten
      pages:
        label: " "
        type: pages
        sortable: false
        create: false
        templates:
          - home
          - ueber-uns
          - seminarplaene
          - aktuelles-container

      footer:
        type: fields
        fields:
          footerDivider:
            type: line
          footerHeadline:
            type: headline
            label: Footer
          footerLogos:
            label: Footer-Logos
            type: files
            layout: cards
            query: site.files
            width: 1/2
          instagramUrl:
            label: Instagram-URL
            type: url
            width: 1/2
